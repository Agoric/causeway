services:
  agd:
    container_name: agoric
    image: ghcr.io/agoric/agoric-3-proposals:latest
    ports:
      - 26656:26656
      - 26657:26657
      - 1317:1317
      - 9090:9090
    environment:
      DEST: 1
      DEBUG: 'SwingSet:ls,SwingSet:vat'
    volumes:
      - ./scripts/a3p.slog:/usr/src/upgrade-test-scripts/slog.slog

  neo4j:
    container_name: neo4j
    image: neo4j:latest
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/secretpassword
